# Test profile: runs anywhere WITHOUT Docker/Postgres.
# H2 in PostgreSQL-compatibility mode, Flyway disabled, Hibernate generates the
# schema from the entities (create-drop). Pure unit tests don't touch this at all.
spring:
  datasource:
    url: jdbc:h2:mem:mayoclone_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

mayoclone:
  # Uploaded files land under build/ (gitignored) during tests.
  upload:
    dir: build/test-uploads
  poll:
    enabled: false
  jobs:
    # Scheduler OFF in tests — suites drive JobQueue/JobWorker directly. Small,
    # deterministic backoff so the backoff-schedule assertion is fast and stable.
    enabled: false
    backoff-base-ms: 1000
    backoff-cap-ms: 60000
    stuck-timeout-ms: 300000
    max-attempts: 8
  jwt:
    secret: test-only-jwt-secret-value-that-is-long-enough-0123456789
    issuer: mayoclone-test
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
  enc:
    # deterministic 32-byte base64 key for tests
    key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  cors:
    origins: http://localhost:5173
  cookie:
    secure: false
  inbound:
    # Deterministic inbound-webhook HMAC secret + domain for tests. The webhook
    # tests sign with the InboundSignatureVerifier bean, so no test needs to know
    # this value — it just must be present and stable.
    domain: inbound.mayoclone.test
    signing-secret: test-inbound-signing-secret-0123456789
  mailgun:
    # Deterministic Mailgun webhook signing key for tests. The Mailgun webhook test
    # signs with the MailgunSignatureVerifier bean, so it just needs to be present.
    signing-key: test-mailgun-signing-key-0123456789
  billing:
    # Gate OFF by default so the existing suites (which hit /api/** with fresh trial
    # accounts) are unaffected; the enforcement test flips this on via @SpringBootTest
    # properties. dev-mode ON so the dev-activate flow is testable without Razorpay.
    enforce: false
    dev-mode: true
    plan:
      code: pro-monthly
      name: MayoClone Pro
      amount: 99900
      currency: INR
      period-days: 30
  razorpay:
    # key-id BLANK → checkout returns 503 (unconfigured). key-secret + webhook-secret
    # are set so the verify/webhook signature tests can compute a matching HMAC.
    key-id: ""
    key-secret: test-razorpay-key-secret-0123456789
    webhook-secret: test-razorpay-webhook-secret-0123456789
