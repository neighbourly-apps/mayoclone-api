server:
  port: 8080

spring:
  application:
    name: mayoclone-api
  # Postgres is the primary datasource. All connection values are env-driven with
  # safe local defaults; NO secrets live in this file. Prod MUST override these.
  datasource:
    url: ${MAYOCLONE_DB_URL:jdbc:postgresql://localhost:5432/mayoclone}
    username: ${MAYOCLONE_DB_USER:mayoclone}
    password: ${MAYOCLONE_DB_PASSWORD:mayoclone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway OWNS the schema. Hibernate only validates that the mapped
      # entities line up with the migrated tables/columns.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Menu-photo uploads: hard cap at 2MB (enforced again in ImageStorageService).
      max-file-size: 2MB
      max-request-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    # Lightweight OTel tracing is wired but DISABLED by default (0.0 sampling) so
    # NO collector is needed to run or build. Set MAYOCLONE_TRACING_SAMPLING>0 and
    # point management.otlp.tracing.endpoint at a collector to enable.
    sampling:
      probability: ${MAYOCLONE_TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${MAYOCLONE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# mayoclone application settings
mayoclone:
  # Local directory where uploaded menu photos are stored and served from
  # (/uploads/**). Relative paths resolve against the process working dir.
  upload:
    dir: ${MAYOCLONE_UPLOAD_DIR:uploads}
  poll:
    # Mailbox polling now runs on the durable job queue: MailboxPollDispatcher enqueues
    # one MAILBOX_SYNC job per DUE vendor every dispatch-tick-ms; the worker pool syncs
    # them in parallel. When false the dispatcher early-returns and no mailbox is touched.
    enabled: ${MAYOCLONE_POLL_ENABLED:false}
    # Per-VENDOR sync cadence: a healthy mailbox is re-polled every interval-ms.
    interval-ms: ${MAYOCLONE_POLL_INTERVAL_MS:60000}
    # How often the dispatcher wakes to enqueue a batch of due vendors.
    dispatch-tick-ms: ${MAYOCLONE_POLL_DISPATCH_TICK_MS:5000}
    # Max vendors enqueued per tick. CAPACITY: batch-size × ticks/min must exceed
    # vendors ÷ (interval-min). Default 200 every 5s = 40/s = 2400/min ⇒ drains 2000
    # mailboxes inside a 60s interval. Raise batch-size (or lower tick-ms) for more.
    dispatch-batch-size: ${MAYOCLONE_POLL_DISPATCH_BATCH_SIZE:200}
    # Ceiling for the per-vendor exponential backoff after repeated mailbox failures.
    backoff-cap-ms: ${MAYOCLONE_POLL_BACKOFF_CAP_MS:3600000}   # 1h
    # When a Gmail Pub/Sub topic is configured (mayoclone.gmail.pubsub.topic), the
    # dispatcher SKIPS GMAIL_OAUTH vendors (push handles them). IMAP/other are still
    # polled. With no topic set, Gmail vendors are polled as a fallback.
    skip-gmail-when-push: ${MAYOCLONE_POLL_SKIP_GMAIL_WHEN_PUSH:true}
  imap:
    # IMAP fetch is READ-AGNOSTIC: we pull by UID (not \Seen), so an email already read
    # by another app or a person is still captured, and we open the folder read-only so
    # we never mark anything read. First sync (or a UIDVALIDITY reset) backfills this many
    # recent messages; each poll processes at most max-per-fetch so a backlog drains over
    # cycles.
    backfill-count: ${MAYOCLONE_IMAP_BACKFILL_COUNT:30}
    max-per-fetch: ${MAYOCLONE_IMAP_MAX_PER_FETCH:200}
  gmail:
    # Gmail push ingestion (Google Pub/Sub + users.watch history sync). ALL blank by
    # default → feature OFF: mailboxes fall back to the poll and the push endpoint
    # returns 503. See docs/INGESTION.md "Gmail push (production scale)".
    pubsub:
      # projects/PROJECT/topics/TOPIC passed to users.watch. BLANK → watch disabled.
      topic: ${MAYOCLONE_GMAIL_PUBSUB_TOPIC:}
    push:
      # When set, POST /api/inbound/gmail/push requires a Google-signed OIDC Bearer
      # JWT whose aud == this value (verified against Google's JWKS). PREFERRED.
      audience: ${MAYOCLONE_GMAIL_PUSH_AUDIENCE:}
      # Fallback shared secret: when set (and no audience), the push endpoint requires
      # a matching ?token= query param (constant-time compare).
      token: ${MAYOCLONE_GMAIL_PUSH_TOKEN:}
    watch:
      # Cadence of the users.watch renewal sweep (Gmail expires a watch after ~7d).
      renew-ms: ${MAYOCLONE_GMAIL_WATCH_RENEW_MS:21600000}   # 6h
  jobs:
    # Durable background job queue (JobWorker + JobQueue). ON by default; the
    # dispatcher claims a batch every poll-ms and runs handlers on a bounded pool.
    enabled: ${MAYOCLONE_JOBS_ENABLED:true}
    poll-ms: ${MAYOCLONE_JOBS_POLL_MS:2000}         # dispatch cadence
    reap-ms: ${MAYOCLONE_JOBS_REAP_MS:60000}        # crash-recovery sweep cadence
    batch-size: ${MAYOCLONE_JOBS_BATCH_SIZE:10}     # jobs claimed per cycle
    concurrency: ${MAYOCLONE_JOBS_CONCURRENCY:8}    # worker-pool threads
    max-attempts: ${MAYOCLONE_JOBS_MAX_ATTEMPTS:8}  # retries before dead-letter
    stuck-timeout-ms: ${MAYOCLONE_JOBS_STUCK_TIMEOUT_MS:300000}  # RUNNING > this → reaped
    backoff-base-ms: ${MAYOCLONE_JOBS_BACKOFF_BASE_MS:2000}      # base of 2^n backoff
    backoff-cap-ms: ${MAYOCLONE_JOBS_BACKOFF_CAP_MS:300000}      # backoff ceiling
  jwt:
    # DEV DEFAULT ONLY — prod MUST set MAYOCLONE_JWT_SECRET to a strong 32+ byte secret.
    secret: ${MAYOCLONE_JWT_SECRET:dev-insecure-jwt-secret-change-me-please-0123456789abcdef}
    issuer: ${MAYOCLONE_JWT_ISSUER:mayoclone}
    access-ttl-seconds: ${MAYOCLONE_JWT_ACCESS_TTL:900}        # 15 minutes
    refresh-ttl-seconds: ${MAYOCLONE_JWT_REFRESH_TTL:604800}   # 7 days
  auth:
    # Email OTP verification for onboarding.
    #  require-email-otp: when TRUE, POST /api/auth/register REQUIRES a valid
    #    emailVerificationToken (the JWT from /api/auth/otp/verify). Default false
    #    so register works tokenless (dev/tests unchanged).
    #  otp-dev-mode: when TRUE, POST /api/auth/otp/send ALSO returns the plaintext
    #    "devCode" so a local UI can display it without SMTP. MUST be false in prod.
    #  otp-ttl-seconds: OTP validity window (default 10 minutes).
    #  email-verify-ttl-seconds: TTL of the email_verify JWT minted on verify (15 min).
    require-email-otp: ${MAYOCLONE_REQUIRE_EMAIL_OTP:false}
    otp-dev-mode: ${MAYOCLONE_OTP_DEV_MODE:true}
    otp-ttl-seconds: ${MAYOCLONE_OTP_TTL:600}
    email-verify-ttl-seconds: ${MAYOCLONE_EMAIL_VERIFY_TTL:900}
    # From-address for OTP emails (only used when real SMTP is configured).
    otp-from: ${MAYOCLONE_OTP_FROM:no-reply@mayoclone.local}
  enc:
    # base64-encoded 32 bytes (AES-256). Empty => documented dev default in the converter.
    # Prod MUST set MAYOCLONE_ENC_KEY. NEVER commit a real key.
    key: ${MAYOCLONE_ENC_KEY:}
  cors:
    # comma-separated allowlist of browser origins that may call the API with credentials.
    origins: ${MAYOCLONE_CORS_ORIGINS:http://localhost:5173}
  cookie:
    # refresh/csrf cookies are Secure only over HTTPS. Local dev is http, so default false.
    # Prod MUST set MAYOCLONE_COOKIE_SECURE=true.
    secure: ${MAYOCLONE_COOKIE_SECURE:false}
  frontend:
    # SPA base URL used for the Gmail OAuth success redirect.
    base-url: ${MAYOCLONE_FRONTEND_BASE_URL:http://localhost:5173}
  inbound:
    # Domain used to mint per-vendor FORWARDING addresses (<token>@<domain>).
    domain: ${MAYOCLONE_INBOUND_DOMAIN:inbound.mayoclone.local}
    # HMAC secret the inbound-email provider signs webhooks with.
    # DEV DEFAULT ONLY — prod MUST set MAYOCLONE_INBOUND_SIGNING_SECRET.
    signing-secret: ${MAYOCLONE_INBOUND_SIGNING_SECRET:dev-inbound-signing-secret-change-me}
  mailgun:
    # Mailgun's HTTP webhook signing key (Dashboard → Sending → Webhooks). Used to
    # verify POST /api/inbound/mailgun. EMPTY BY DEFAULT → that endpoint is DISABLED
    # and returns 503. Set MAYOCLONE_MAILGUN_SIGNING_KEY to enable the Mailgun path.
    signing-key: ${MAYOCLONE_MAILGUN_SIGNING_KEY:}

# Google OAuth (Gmail readonly ingestion). ABSENT by default → the Gmail feature
# is disabled gracefully (endpoints return 503); the app still starts. Set all
# three in prod to enable.
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
