server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:mayoclone;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2

management:
  endpoints:
    web:
      exposure:
        include: health,info

# mayoclone application settings
mayoclone:
  poll:
    # when false, PollScheduler early-returns and does not touch any mailbox
    enabled: false
    interval-ms: 60000

---
# Postgres profile: activate with SPRING_PROFILES_ACTIVE=postgres
# All connection values are env-driven so no secrets live in this file.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mayoclone}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:mayoclone}
    password: ${POSTGRES_PASSWORD:mayoclone}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
