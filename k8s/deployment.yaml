apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayoclone-api
  namespace: mayoclone
  labels:
    app.kubernetes.io/name: mayoclone-api
    app.kubernetes.io/part-of: mayoclone
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mayoclone-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mayoclone-api
        app.kubernetes.io/part-of: mayoclone
      annotations:
        # Prometheus scrape hints (adjust to your operator's conventions).
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      # Pod-level hardening.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with your registry/image:tag (see docker.yml / README).
          image: ghcr.io/OWNER/mayoclone-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mayoclone-api-config
            - secretRef:
                name: mayoclone-api-secrets
          # Container-level hardening.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Spring Boot actuator group probes (probes.enabled=true in app config).
          startupProbe:
            # Give the JVM + Flyway migrations time on cold start before
            # liveness/readiness take over.
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # readOnlyRootFilesystem=true, so give writable scratch dirs.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
