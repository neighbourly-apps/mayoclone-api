# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE ONLY — DO NOT COMMIT REAL SECRETS.
# Copy to secret.yaml, replace every placeholder with a real value, and apply
# out-of-band (or better: use an external secret manager / sealed-secrets).
# secret.yaml should be gitignored.
#
#   cp secret.example.yaml secret.yaml && $EDITOR secret.yaml
#   kubectl apply -f secret.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mayoclone-api-secrets
  namespace: mayoclone
  labels:
    app.kubernetes.io/name: mayoclone-api
    app.kubernetes.io/part-of: mayoclone
type: Opaque
stringData:
  # App crypto — MUST be strong, 32+ byte random values.
  MAYOCLONE_JWT_SECRET: "REPLACE_ME_jwt_secret_32_bytes_minimum"
  MAYOCLONE_ENC_KEY: "REPLACE_ME_encryption_key_32_bytes_minimum"
  # Database.
  MAYOCLONE_DB_URL: "jdbc:postgresql://postgres.mayoclone:5432/mayoclone"
  MAYOCLONE_DB_USER: "REPLACE_ME_db_user"
  MAYOCLONE_DB_PASSWORD: "REPLACE_ME_db_password"
  # Inbound mail webhook signing secret.
  MAYOCLONE_INBOUND_SIGNING_SECRET: "REPLACE_ME_inbound_signing_secret"
  # Google OAuth credentials.
  GOOGLE_OAUTH_CLIENT_ID: "REPLACE_ME_google_client_id"
  GOOGLE_OAUTH_CLIENT_SECRET: "REPLACE_ME_google_client_secret"
  # Razorpay — set ALL THREE to flip checkout from 503 → live. Blank/unset keeps
  # billing checkout disabled. (Non-secret plan amounts + toggles are in the ConfigMap.)
  RAZORPAY_KEY_ID: "REPLACE_ME_razorpay_key_id"
  RAZORPAY_KEY_SECRET: "REPLACE_ME_razorpay_key_secret"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_ME_razorpay_webhook_secret"
  # SMTP credentials — the ConfigMap sets SPRING_MAIL_HOST/PORT (the switch);
  # these are the username/password. Real email (OTP + renewal reminders) turns
  # on once SPRING_MAIL_HOST is set.
  SPRING_MAIL_USERNAME: "REPLACE_ME_smtp_username"
  SPRING_MAIL_PASSWORD: "REPLACE_ME_smtp_password"
